# Builds the Chrome and Firefox zips and attaches them to a GitHub release.
#
# Publish a release with a tag like v0.4.0 (v.0.4.0 also works). The zips are built with the
# tag's version, so package.json doesn't have to be bumped first (a warning says when it differs).
# To rebuild an existing release, run this workflow by hand and give it the tag.

name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach zips to (e.g. v0.4.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Use the release tag as the extension version
        run: |
          ver="${TAG#v}"
          ver="${ver#.}"
          # Exactly MAJOR.MINOR.PATCH: whole numbers 0-65535 (what browsers accept per part), no
          # leading zeros (npm and the stores would read 0.04.0 as 0.4.0), no -beta suffixes.
          part='(0|[1-9][0-9]{0,4})'
          if ! [[ "$ver" =~ ^$part\.$part\.$part$ ]]; then
            echo "::error::Release tag '$TAG' must be v<major>.<minor>.<patch> with plain numbers (e.g. v0.4.0 or v.0.4.0; no leading zeros, no extra parts)."
            exit 1
          fi
          for n in ${ver//./ }; do
            if [ "$n" -gt 65535 ]; then
              echo "::error::Release tag '$TAG': each version part must be at most 65535 (got $n)."
              exit 1
            fi
          done
          current="$(node -p "require('./package.json').version")"
          if [ "$ver" != "$current" ]; then
            echo "::warning::package.json says $current; building as $ver from the tag. Bump package.json to match next time."
            npm version "$ver" --no-git-tag-version --allow-same-version
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - run: npm test

      - name: Build zips
        run: npm run zip

      - name: Lint the Firefox build
        run: npx --yes web-ext@10 lint --source-dir dist/firefox

      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*-"$VERSION".zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No zips for version $VERSION in release/."
            ls -la release || true
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "Attached: ${files[*]}"
